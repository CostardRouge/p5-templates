services:
  app:
    # Prod (Portainer) pulls this published image; the moving `:main` tag lets
    # the Portainer webhook re-pull the latest build. Override APP_IMAGE to pin
    # an immutable `sha-<short>` tag for rollbacks. Local dev still uses `build`.
    image: ${APP_IMAGE:-ghcr.io/costardrouge/p5-templates:main}
    build:
      context: .
      args:
        BACKEND_RECORDING: ${BACKEND_RECORDING:-false}
        NOTIFICATIONS: ${NOTIFICATIONS:-false}
        LIVE_THUMBNAIL: ${LIVE_THUMBNAIL:-false}
        NEXT_PUBLIC_GITHUB_REPO_URL: ${NEXT_PUBLIC_GITHUB_REPO_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    labels:
      # Opt this container in to Watchtower updates (see deploy/watchtower.compose.yml).
      # With WATCHTOWER_LABEL_ENABLE=true only labelled containers are touched, so
      # redis / postgres / minio are never auto-updated.
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - pipeline
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      - BACKEND_RECORDING=${BACKEND_RECORDING:-false}
      - NOTIFICATIONS=${NOTIFICATIONS:-false}
      - LIVE_THUMBNAIL=${LIVE_THUMBNAIL:-false}
      - NEXT_PUBLIC_GITHUB_REPO_URL=${NEXT_PUBLIC_GITHUB_REPO_URL:-}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Redis for BullMQ queue ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - pipeline
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO for S3-compatible storage ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio123}
    networks:
      - pipeline
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-social-pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-social-pipeline-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-social-pipeline-pass}
    networks:
      - pipeline
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-social-pipeline-user} -d ${POSTGRES_DB:-social-pipeline}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  minio-data:
  postgres-data:

networks:
  pipeline:
    driver: bridge
