name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

# Cancel an in-progress run when a new commit lands on the same PR. On `main`,
# head_ref is empty -> fallback to run_id (unique) -> main runs are never
# cancelled, so every commit pushed to main is validated end-to-end.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Two jobs, not four (2026-11-20, docs/memory/deployment.md "CI: one install"):
# `npm ci` was 56% of the runner time, paid four times for 10 to 42 s of real
# work each. Lint, typecheck and tests now share one install; node_modules is
# cached on the lockfile, so an unchanged lockfile skips `npm ci` entirely.
jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Keyed on the Node version too: native modules (sharp, prisma's engines)
      # are built for one ABI.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
        env:
          HUSKY: 0

      # `npm ci` runs it as postinstall; a restored node_modules does not, and
      # the client lands in src/generated/prisma, outside the cache.
      - name: Generate the Prisma client
        if: steps.modules.outputs.cache-hit == 'true'
        run: npx prisma generate

      # ESLint's own cache (`--cache-location .next/cache/eslint`): only the
      # files a commit changed are linted again.
      - name: Restore the lint cache
        uses: actions/cache@v6
        with:
          path: .next/cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-

      - name: Lint
        run: npm run lint

      # TypeScript 7 (the native compiler), installed alongside the JS-based
      # `typescript` that ts-jest and typescript-eslint still need. `next build`
      # type-checks too, but only what the app graph reaches — this covers
      # everything in tsconfig, tests included, and takes ~8s.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Unit + regression tests
        if: ${{ !cancelled() }}
        run: npm test -- --ci

  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
        env:
          HUSKY: 0

      - name: Generate the Prisma client
        if: steps.modules.outputs.cache-hit == 'true'
        run: npx prisma generate

      # What Next recommends in CI: its compiler cache, keyed on the lockfile
      # and the sources so a later commit restores the closest one.
      - name: Restore the Next build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Production build smoke test
        run: npm run build
        env:
          # Build-time env vars consumed by next.config.ts. No real backend is
          # needed — `next build` just compiles every sketch route end-to-end
          # so we catch broken imports / oversized serverless bundles before
          # production. Mirrors the args used by the Docker build.
          BACKEND_RECORDING: "false"
          NOTIFICATIONS: "false"
          LIVE_THUMBNAIL: "false"
          PREVIEW_ON_HOVER: "false"
          # On so the build compiles the interaction-bindings plugin path
          # (matches the deployed image, which enables it).
          INTERACTION_BINDINGS: "true"
          NODE_ENV: production
