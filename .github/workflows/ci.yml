name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

# Cancel an in-progress run when a new commit lands on the same PR. On `main`,
# head_ref is empty -> fallback to run_id (unique) -> main runs are never
# cancelled, so every commit pushed to main is validated end-to-end.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Unit + regression tests
        run: npm test -- --ci

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Production build smoke test
        run: npm run build
        env:
          # Build-time env vars consumed by next.config.ts. No real backend is
          # needed — `next build` just compiles every sketch route end-to-end
          # so we catch broken imports / oversized serverless bundles before
          # production. Mirrors the args used by the Docker build.
          BACKEND_RECORDING: "false"
          NOTIFICATIONS: "false"
          LIVE_THUMBNAIL: "false"
          PREVIEW_ON_HOVER: "false"
          # On so the build compiles the interaction-bindings plugin path
          # (matches the deployed image, which enables it).
          INTERACTION_BINDINGS: "true"
          NODE_ENV: production
