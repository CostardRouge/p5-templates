name: Registre

# Rapporte l'état du projet au registre (`projets/` de costardrouge/second-brain)
# sans qu'aucune session n'ait à toucher second-brain — CLAUDE.md, règle
# « Report the project's state ».
#
# À chaque push sur main : retrouver la PR fusionnée de ce commit, lire le bloc
# `### Registre` de sa description — ou, sans PR ou sans bloc, ceux des messages
# des commits poussés (une session locale l'écrit là) — et l'envoyer à
# second-brain par un `repository_dispatch`. C'est second-brain qui écrit la
# fiche (`.github/workflows/registre-reception.yml` là-bas). Ce fichier est
# identique dans chaque dépôt du portfolio : le modifier ici, c'est le modifier
# partout.
#
# Le secret REGISTRE_TOKEN (un token fin, « Contents: write » sur second-brain
# SEUL) vit dans l'environnement `registre`, réservé à la branche main : un
# workflow poussé sur une autre branche ne peut pas le lire. Sans secret, le job
# le dit et sort en vert ; un token refusé (expiré) le fait rougir.
#
# Rejouer un rapport : relancer ce job sur le commit concerné. Second-brain
# ignore une source qu'il a déjà, donc c'est sans risque.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  registre:
    runs-on: ubuntu-latest
    environment: registre
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          REGISTRE_TOKEN: ${{ secrets.REGISTRE_TOKEN }}
        with:
          script: |
            const token = process.env.REGISTRE_TOKEN;
            if (!token) {
              core.warning("REGISTRE_TOKEN absent de l'environnement « registre » : rien n'est rapporté.");
              return;
            }

            // Le bloc : de « ### Registre » (ou une ligne « Registre » seule)
            // jusqu'au titre suivant de niveau 1 à 3 hors bloc de code.
            const section = (text) => {
              const lines = String(text || "").replace(/\r/g, "").split("\n");
              const start = lines.findIndex((l) => /^\s*(#{1,4}\s*)?Registre\s*:?\s*$/i.test(l));
              if (start < 0) return null;
              const out = [];
              let fence = false;
              for (const l of lines.slice(start + 1)) {
                if (/^\s*```/.test(l)) fence = !fence;
                else if (!fence && /^#{1,3}\s/.test(l)) break;
                out.push(l);
              }
              const block = out.join("\n").trim();
              return block ? block.slice(0, 6000) : null;
            };

            const { owner, repo } = context.repo;
            const full = `${owner}/${repo}`;
            const sources = [];

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha,
            });
            for (const pr of prs.filter((p) => p.merged_at)) {
              const block = section(pr.body);
              if (block) sources.push({ ref: `${full}#${pr.number}`, title: pr.title, url: pr.html_url, date: pr.merged_at, block });
            }

            if (sources.length === 0) {
              for (const c of context.payload.commits || []) {
                const block = section(c.message);
                if (block) sources.push({ ref: `${full}@${c.id.slice(0, 7)}`, title: c.message.split("\n")[0], url: c.url, date: c.timestamp, block });
              }
            }

            if (sources.length === 0) {
              core.info("Aucun bloc Registre dans ce push : rien à rapporter.");
              return;
            }

            const res = await fetch("https://api.github.com/repos/costardrouge/second-brain/dispatches", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
              },
              body: JSON.stringify({ event_type: "registre", client_payload: { repo: full, sources: sources.slice(0, 10) } }),
            });
            if (res.status !== 204) {
              core.setFailed(`second-brain a refusé le rapport (${res.status}) : ${await res.text()}`);
              return;
            }
            core.info(`Rapporté à second-brain : ${sources.map((s) => s.ref).join(", ")}`);
