name: Build & Push Docker Image

# The full server image (recording, notifications, the debug pages) for a self-hosted backend.
# Built by hand only (2026-11-20, docs/memory/deployment.md "Production is the static front
# alone"): the public site is the static export Cloudflare deploys on every push, and no server
# runs this image any more, so building it at each release cost ~11 min of runner for nobody.
#
# "Run workflow" builds the ref you pick in its menu:
# - a release tag (vX.Y.Z): the image gets X.Y.Z, X.Y and latest;
# - main: the image gets main and latest;
# - any other branch: only its sha-<short> tag, to try a build without moving latest.
# Then, if DEPLOY_WEBHOOK_URL is set, it asks Watchtower to re-pull (deploy/README.md).

on:
  workflow_dispatch:

concurrency:
  group: docker-build
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/costardrouge/p5-templates
      # Optional: point this at the Watchtower HTTP API on your NAS to trigger an
      # instant redeploy after each build (see deploy/README.md). Leave the secret
      # unset and the build still publishes — only the redeploy step is skipped.
      #   DEPLOY_WEBHOOK_URL   e.g. https://watchtower.example.com/v1/update?image=ghcr.io/costardrouge/p5-templates
      #   DEPLOY_WEBHOOK_TOKEN matches WATCHTOWER_HTTP_API_TOKEN on the NAS
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
      DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Which tags?
        id: release
        run: |
          is_release=false
          is_main=false
          if [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version=${GITHUB_REF_NAME#v}
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
            is_release=true
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            is_main=true
          fi
          echo "release=$is_release" >> "$GITHUB_OUTPUT"
          echo "main=$is_main" >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE from $GITHUB_REF_NAME ($(git rev-parse --short HEAD))." >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `latest` (and `main`) move: what Watchtower and the NAS compose re-pull.
          # The version tags and `sha-<short>` are what you pin to for a rollback.
          tags: |
            type=raw,value=latest,enable=${{ steps.release.outputs.release == 'true' || steps.release.outputs.main == 'true' }}
            type=raw,value=main,enable=${{ steps.release.outputs.main == 'true' }}
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.release == 'true' }}
            type=raw,value=${{ steps.release.outputs.minor }},enable=${{ steps.release.outputs.release == 'true' }}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions layer cache, so unchanged layers (base image, deps)
          # aren't rebuilt every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BACKEND_RECORDING=true
            NOTIFICATIONS=false
            LIVE_THUMBNAIL=true
            INTERACTION_BINDINGS=true
            NEXT_PUBLIC_GITHUB_REPO_URL=${{ vars['NEXT_PUBLIC_GITHUB_REPO_URL'] }}

      - name: Trigger redeploy (Watchtower HTTP API)
        if: env.DEPLOY_WEBHOOK_URL != ''
        run: |
          echo "Triggering Watchtower update…"
          curl -fsS --retry 3 --retry-delay 5 -X POST \
            -H "Authorization: Bearer ${DEPLOY_WEBHOOK_TOKEN}" \
            "${DEPLOY_WEBHOOK_URL}"
