name: Preview · Teardown (NAS)

# Removes the ephemeral NAS environment when the `preview` label is removed
# or the PR is closed/merged.

on:
  pull_request:
    types: [unlabeled, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  teardown:
    # Run when:
    #  - the `preview` label was just removed, OR
    #  - the PR was closed while still carrying the `preview` label.
    if: >-
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview') ||
      (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview'))
    runs-on: [self-hosted, nas]
    steps:
      - name: Checkout (for scripts)
        uses: actions/checkout@v4

      - name: Tear down preview
        run: bash scripts/preview-down.sh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
          SHARED_INFRA_NETWORK: ${{ vars.SHARED_INFRA_NETWORK }}
          TRAEFIK_NETWORK: ${{ vars.TRAEFIK_NETWORK }}
          POSTGRES_CONTAINER: ${{ vars.POSTGRES_CONTAINER }}
          MINIO_CONTAINER: ${{ vars.MINIO_CONTAINER }}
          REDIS_CONTAINER: ${{ vars.REDIS_CONTAINER }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          S3_PUBLIC_ENDPOINT: ${{ vars.S3_PUBLIC_ENDPOINT }}
          POSTGRES_PASSWORD: ${{ secrets.PREVIEW_POSTGRES_PASSWORD }}
          S3_ACCESS_KEY: ${{ secrets.PREVIEW_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.PREVIEW_S3_SECRET_KEY }}

      - name: Comment teardown on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- nas-preview -->';
            const body = `${marker}\n🧹 NAS preview for this PR has been torn down.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            }
