# Dependabot, the portfolio's shape (COMMON-PROJECT-SPEC.md, C20).
# Monthly, after a cooldown; every minor and patch in one pull request;
# families that only work in step move their major together; any other major
# is its own pull request. Security updates skip the schedule and the cooldown.
# Reasons and lift conditions for every `ignore`: docs/memory/tooling.md.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    groups:
      # Families that only work in step: a major moves the whole family.
      # Listed first, since a dependency goes to the first group it matches.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
        update-types: [major]
      next:
        patterns: ['next', 'eslint-config-next', '@next/*']
        update-types: [major]
      eslint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', '@typescript-eslint/*', 'eslint-plugin-*', 'eslint-config-*', '@stylistic/eslint-plugin']
        update-types: [major]
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
        update-types: [major]
      # The CLI generates the client into src/generated/prisma: the two move
      # together or not at all (docs/memory/tooling.md).
      prisma:
        patterns: ['prisma', '@prisma/*']
        update-types: [major]
      jest:
        patterns: ['jest', 'jest-*', '@jest/*', '@types/jest', 'ts-jest']
        update-types: [major]
      # Every minor and patch, production and development together:
      # one pull request a month.
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # Node's type definitions follow .nvmrc's major (C14).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # `typescript` stays on 6 on purpose: ts-jest, typescript-eslint and
      # `next build` need the JS compiler API that 7 dropped. `typescript7` is
      # the alias that follows 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # `playwright` moves only with the Playwright image of the Dockerfile
      # (scripts/__tests__/dockerfile.test.ts holds the two together), and a
      # Dependabot pull request can carry one side only: both are raised by
      # hand, in one commit (docs/memory/deployment.md).
      - dependency-name: 'playwright'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # The Dockerfile's only base is the Playwright image, held with the
  # `playwright` package above; the block stays so a new base is watched.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # Dependabot names the image `playwright` (see #406); the wildcard also
      # covers a registry-qualified name.
      - dependency-name: '*playwright'

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # A Postgres major cannot read the previous major's data directory: it
      # takes a dump and restore on the NAS, by hand.
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']
